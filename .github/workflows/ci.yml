name: CI - Lint, Build, Audit

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Build
        run: npm run build

      - name: Audit high severity
        run: npm audit --audit-level=high

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          node --check server.js
          node --check worker.js
          find config controllers jobs middleware models routes services utils scripts -name "*.js" -o -name "*.mjs" | while read -r f; do
            echo "Checking $f..."
            node --check "$f"
          done

      - name: Audit high severity
        run: npm audit --audit-level=high

  docker:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t smartspend-backend ./backend

      - name: Build frontend image
        run: docker build -t smartspend-frontend ./frontend
